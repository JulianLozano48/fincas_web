<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dos Refugios · Fincas campestres en alquiler</title>
  <meta name="description" content="Alquiler de dos fincas campestres: El Mirador, en la montaña, y Los Guaduales, en tierra caliente.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="css/primavera.css">
</head>
<body>

  <!-- ============ FONDO: 2 fotos que se funden entre sí ============ -->
  <div class="bg" aria-hidden="true">
    <div class="bg__img bg__img--1"></div>
    <div class="bg__img bg__img--2"></div>
    <div class="bg__veil"></div>
  </div>

  <!-- ============ ENCABEZADO ============ -->
  <header class="top">
    <a href="index.html" class="logo">Dos <em>Refugios</em></a>
    <a href="#contacto" class="top__link">Contacto</a>
  </header>

  <!-- ============ MENÚ INICIAL ============ -->
  <main class="home">
    <div class="intro">
      <p class="intro__eyebrow">Fincas campestres para tu comodidad</p>
      <h1>¿Que deseas <em>disfrutar</em>?</h1>
    </div>

    <!-- Las cards se generan desde js/fincas-data.js -->
    <div class="cards" id="cards"></div>

    <noscript><p class="noscript">Activa JavaScript para ver las fincas.</p></noscript>
  </main>


  <!-- ============ VISTA EXPANDIDA DE FINCA ============ -->
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
    <button class="detail__close" id="detailClose" aria-label="Volver a las fincas">✕</button>
    <div class="detail__scroll" id="detailScroll">

      <header class="detail__hero" id="detailHero">
        <div class="detail__hero-text">
          <span class="tag" id="detailTag"></span>
          <h2 id="detailTitle"></h2>
          <p id="detailLema"></p>
        </div>
      </header>

      <div class="detail__body">
        <section class="block block--intro">
          <div>
            <p class="detail__place" id="detailPlace"></p>
            <p class="detail__desc" id="detailDesc"></p>
          </div>
          <ul class="facts" id="detailFacts"></ul>
        </section>

        <section class="block">
          <h3>Fotos</h3>
          <div class="thumbs" id="detailThumbs"></div>
        </section>

        <section class="block">
          <h3>Comodidades</h3>
          <ul class="chips" id="detailAmenities"></ul>
        </section>

        <section class="block">
          <h3>Tarifas</h3>
          <ul class="prices" id="detailPrices"></ul>
          <p class="note">Precios en pesos colombianos. Depósito del 50 % para confirmar.</p>
        </section>

        <div class="detail__cta">
          <a class="btn btn--accent" id="detailWhatsapp" target="_blank" rel="noopener">Reservar por WhatsApp</a>
          <a class="btn btn--line" id="detailPage">Ver página completa</a>
        </div>
      </div>

      <!-- Vista especial de La Primavera (la llena js/primavera.js) -->
      <div class="pv" id="primavera" hidden></div>
    </div>
  </div>

  <script src="js/fincas-data.js"></script>
  <script src="js/primavera.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
